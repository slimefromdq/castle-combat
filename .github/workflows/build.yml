name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-web

      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/version.txt \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/web_nothreads_release.zip templates/web_nothreads_debug.zip -d "$dest"

      - run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Rule tests
        run: godot --headless --path . -s tests/run_tests.gd

      - name: Smoke run (10 s of a match, no script errors allowed)
        run: |
          godot --headless --path . --quit-after 600 -- --autoplay 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error" smoke.log; then exit 1; fi
          # Bot-driven run through the first Relay (spawn, pickup, carry, delivery views).
          godot --headless --path . --quit-after 2400 -- --autoplay --autopilot --skip=55 2>&1 | tee smoke2.log
          if grep -E "SCRIPT ERROR|Parse Error" smoke2.log; then exit 1; fi

      - name: Export Windows and web builds
        run: |
          mkdir -p build/windows build/web
          godot --headless --path . --export-release "Windows Desktop" build/windows/CastleCombat.exe
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/windows/CastleCombat.exe
          test -s build/web/index.wasm

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CastleCombat-windows
          path: build/windows/

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
